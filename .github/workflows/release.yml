name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish portable release
    runs-on: windows-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run test:unit

      - name: Build the Tauri app (publishes the sidecar via build.rs)
        run: npm run tauri -- build --no-bundle

      - name: Assemble the portable distribution
        run: npm run dist:portable

      - name: Smoke test
        run: npm run test:smoke

      - name: Deployment check
        run: npm run verify:deployment

      - name: Collect the portable files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = Join-Path $env:RUNNER_TEMP "MeetingNotes-v$version-win-x64.zip"
          Compress-Archive -Path 'dist/portable/*' -DestinationPath $zip -CompressionLevel Optimal
          # Kein Get-FileHash: das Utility-Modul ist auf einem Build-Runner
          # nicht zwingend geladen. Die .NET-API ist ueberall vorhanden.
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $stream = [System.IO.File]::OpenRead($zip)
          try { $bytes = $sha.ComputeHash($stream) } finally { $stream.Dispose(); $sha.Dispose() }
          $hash = ([System.BitConverter]::ToString($bytes) -replace '-', '').ToLowerInvariant()
          # Eine Textdatei, kein ZIP: der Name sagt, was es ist.
          "sha256:$hash  MeetingNotes-v$version-win-x64.zip" |
            Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt') -Encoding utf8
          Write-Host "ZIP: $zip ($((Get-Item $zip).Length) Bytes)"
          Write-Host "SHA256: $hash"
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_PATH=$zip"
          Add-Content -Path $env:GITHUB_ENV -Value "SUMS_PATH=$env:RUNNER_TEMP/SHA256SUMS.txt"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"

      - name: Upload the release asset
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SUMS_PATH }}
          if-no-files-found: error

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          $version = $env:RELEASE_VERSION
          $zip = Join-Path $env:RUNNER_TEMP "MeetingNotes-v$version-win-x64.zip"
          $sums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          $notes = @"
          ## Meeting Notes v$version
          Portable-Distribution fuer Windows x64.
          
          ### Enthalten
          - `MeetingNotes.exe` (Tauri-Host)
          - `MeetingNotes.Sidecar.exe` (self-contained, komprimiert und konservativ getrimmt) - **keine .NET-Installation noetig**
          - `MeetingNotes.config.example.json`
          - `SHA256SUMS`
          
          ### Installation
          1. ZIP herunterladen und **alle Dateien** in einen beschreibbaren Ordner entpacken
          2. `MeetingNotes.exe` starten; `MeetingNotes.Sidecar.exe` muss im selben Ordner liegen
          3. `MeetingNotes.config.example.json` nach `MeetingNotes.config.json` kopieren und die Azure-Zugangsdaten eintragen
          
          ### Voraussetzungen
          - Windows 11 x64
          - Microsoft Edge WebView2 Runtime (auf vielen Windows-11-Systemen bereits vorhanden)
          - Internetzugang und ein Azure-Speech-Ressource mit Endpunkt, Region und Schluessel
          - Mikrofon und/oder ein Ausgabegeraet
          
          Die App ist nicht code-signiert; Windows kann daher eine Sicherheitswarnung anzeigen.
          Details und offene Punkte: [SPEC.md](https://github.com/${{ github.repository }}/blob/main/SPEC.md).
          "@
          $notes | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'notes.md') -Encoding utf8
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag existiert bereits - Assets werden ersetzt."
            gh release upload $tag $zip $sums --clobber
            gh release edit $tag --notes-file (Join-Path $env:RUNNER_TEMP 'notes.md') --title "Meeting Notes v$version"
          } else {
            # Kein --target: das Tag existiert bereits, und die API lehnt
            # einen Tag-Namen als target_commitish ab.
            gh release create $tag $zip $sums --title "Meeting Notes v$version" --notes-file (Join-Path $env:RUNNER_TEMP 'notes.md')
          }
          gh release view $tag --json url,tagName,assets
