name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish portable release
    runs-on: windows-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run test:unit

      - name: Build the Tauri app (publishes the sidecar via build.rs)
        run: npm run tauri -- build --no-bundle

      - name: Assemble the portable distribution
        run: npm run dist:portable

      - name: Smoke test
        run: npm run test:smoke

      - name: Deployment check
        run: npm run verify:deployment

      - name: Collect the portable files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = Join-Path $env:RUNNER_TEMP "MeetingNotes-v$version-win-x64.zip"
          Compress-Archive -Path 'dist/portable/*' -DestinationPath $zip -CompressionLevel Optimal
          # No Get-FileHash: the utility module is not necessarily loaded on a build runner.
          # The .NET API is available everywhere.
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $stream = [System.IO.File]::OpenRead($zip)
          try { $bytes = $sha.ComputeHash($stream) } finally { $stream.Dispose(); $sha.Dispose() }
          $hash = ([System.BitConverter]::ToString($bytes) -replace '-', '').ToLowerInvariant()
          # A text file, not a ZIP: the name says what it is.
          # Same format as the SHA256SUMS in the archive: without a prefix, so that
          # `sha256sum -c SHA256SUMS.txt` works directly.
          "$hash  MeetingNotes-v$version-win-x64.zip" |
            Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt') -Encoding utf8
          Write-Host "ZIP: $zip ($((Get-Item $zip).Length) Bytes)"
          Write-Host "SHA256: $hash"
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_PATH=$zip"
          Add-Content -Path $env:GITHUB_ENV -Value "SUMS_PATH=$env:RUNNER_TEMP/SHA256SUMS.txt"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"

      - name: Upload the release asset
        uses: actions/upload-artifact@v7.0.2
        with:
          name: portable-zip
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SUMS_PATH }}
          if-no-files-found: error

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          if ($tag -cne "v$version") { throw "Tag $tag does not match package version $version." }
          $zip = Join-Path $env:RUNNER_TEMP "MeetingNotes-v$version-win-x64.zip"
          $sums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, '(?ms)^## v' + [regex]::Escape($version) + ' - [^\r\n]+\r?\n(?<body>.*?)(?=^## |\z)')
          if (-not $section.Success) { throw "No changelog section for $tag." }
          $installation = @'
          ### Installation
          Download the ZIP and extract **all files** into a new writable folder. Keep `MeetingNotes.exe` and `MeetingNotes.Sidecar.exe` from this ZIP together. Requires Windows 11 x64 and WebView2; no .NET installation is needed.

          Azure credentials are required only for Azure transcription. Local recording and Windows SAPI do not use Azure. The app is not code-signed, so Windows may display a security warning.
          '@
          $notes = "## Meeting Notes v$version`n`n" + $section.Groups['body'].Value.Trim() + "`n`n" + $installation
          $notes | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'notes.md') -Encoding utf8
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists - the assets are replaced."
            gh release upload $tag $zip $sums --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload the release assets.' }
            gh release edit $tag --notes-file (Join-Path $env:RUNNER_TEMP 'notes.md') --title "Meeting Notes v$version"
          } else {
            # No --target: the tag already exists, and the API rejects
            # a tag name as target_commitish.
            gh release create $tag $zip $sums --verify-tag --title "Meeting Notes v$version" --notes-file (Join-Path $env:RUNNER_TEMP 'notes.md')
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub release.' }
          gh release view $tag --json url,tagName,assets
