[package]
name = "meeting-notes"
version = "0.1.6"
description = "Meeting Notes (Windows desktop app for meeting transcripts)"
authors = ["Martin Pietschmann"]
license = "MIT"
edition = "2021"
# tauri 2.12.x verlangt Rust >= 1.90 (MSRV).
rust-version = "1.90"

[lib]
name = "meeting_notes_lib"
# Tauri 2 linkt die Lib statisch in die EXE — `cdylib` würde nur eine
# ~28 MB große DLL erzeugen, die niemand lädt (sie landete bisher
# trotzdem im Release-Ordner und wurde von dist-portable.mjs blind
# mitkopiert).
crate-type = ["staticlib", "rlib"]

[profile.release]
incremental = true
debug = false
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
# reqwest 0.13 hat das Feature "rustls-tls" umbenannt: "rustls" nutzt den
# Platform-Verifier und damit den Windows-Zertifikatsspeicher.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
url = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
# Regressionsschutz fuer die HTTPS-Diagnose: der Test startet einen lokalen
# TLS-Server mit selbstsigniertem Zertifikat und prueft, dass die Probe das
# Zertifikat ablehnt. `aws-lc-rs` passt zum Provider von `reqwest`/`rustls`,
# damit kein Provider-Konflikt entsteht.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
