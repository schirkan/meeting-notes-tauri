[package]
name = "meeting-notes"
version = "0.1.0"
description = "Meeting Notes (Windows-Desktop-App fuer Meeting-Transkripte)"
authors = ["Martin Pietschmann <martin.pietschmann@itergo.com>"]
license = "MIT"
edition = "2021"
# tauri 2.12.x verlangt Rust >= 1.90 (MSRV).
rust-version = "1.90"

[lib]
name = "meeting_notes_lib"
# Tauri 2 linkt die Lib statisch in die EXE — `cdylib` würde nur eine
# ~28 MB große DLL erzeugen, die niemand lädt (sie landete bisher
# trotzdem im Release-Ordner und wurde von dist-portable.mjs blind
# mitkopiert).
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
# reqwest 0.13 hat das Feature "rustls-tls" umbenannt: "rustls" nutzt den
# Platform-Verifier und damit den Windows-Zertifikatsspeicher.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
url = "2"
